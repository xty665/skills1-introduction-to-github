<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>钢铁前线：迷你坦克大战</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: grid; place-items: center; font-family: system-ui, sans-serif; color: white; }
  .wrap { width: min(100vw, 760px); padding: 16px; box-sizing: border-box; }
  canvas { width: 100%; aspect-ratio: 5 / 4; background: #202820; image-rendering: pixelated; display: block; border: 4px solid #e6e0c8; box-shadow: 0 20px 60px #0008; }
  .hud { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; font-weight: 700; }
  button { margin-top: 10px; padding: 10px 14px; border: 0; border-radius: 6px; background: #e6c34a; color: #1b1608; font-weight: 800; cursor: pointer; }
</style>
<div class="wrap">
  <div class="hud"><span id="score">SCORE 0</span><span id="status">WASD / 方向键移动，空格开火</span><span id="lives">LIVES 3</span></div>
  <canvas id="game" width="600" height="480"></canvas>
  <button onclick="restart()">重新开始</button>
</div>
<script>
const c = document.getElementById('game'), x = c.getContext('2d');
const scoreEl = document.getElementById('score'), livesEl = document.getElementById('lives'), statusEl = document.getElementById('status');
const keys = new Set(); let score=0, lives=3, over=false, won=false, tick=0;
const player={x:285,y:400,w:30,h:30,dir:0,cool:0};
let bullets=[], enemies=[];
const walls=[
  [90,80,40,40],[130,80,40,40],[430,80,40,40],[470,80,40,40],
  [250,160,40,40],[290,160,40,40],[250,200,40,40],[290,200,40,40],
  [90,300,40,40],[130,300,40,40],[430,300,40,40],[470,300,40,40],
  [260,430,30,30],[310,430,30,30]
];
const base={x:285,y:440,w:30,h:30,alive:true};
function restart(){ score=0; lives=3; over=false; won=false; bullets=[]; enemies=[]; Object.assign(player,{x:285,y:400,dir:0,cool:0}); base.alive=true; for(let i=0;i<5;i++)spawn(); loop(); }
function spawn(){ if(enemies.length<6) enemies.push({x:40+Math.random()*520,y:30,w:30,h:30,dir:2,cool:40,turn:0}); }
function hit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function blocked(o){ return o.x<0||o.y<0||o.x+o.w>600||o.y+o.h>480||walls.some(w=>hit(o,{x:w[0],y:w[1],w:w[2],h:w[3]}))||(base.alive&&hit(o,base)); }
function move(t, sp){ const old={x:t.x,y:t.y}; if(t.dir===0)t.y-=sp; if(t.dir===1)t.x+=sp; if(t.dir===2)t.y+=sp; if(t.dir===3)t.x-=sp; if(blocked(t)){t.x=old.x;t.y=old.y;return false} return true; }
function fire(t, own){ if(t.cool>0)return; t.cool=own?18:55; let b={x:t.x+13,y:t.y+13,w:4,h:4,dir:t.dir,own}; if(t.dir===0)b.y=t.y-6; if(t.dir===1)b.x=t.x+32; if(t.dir===2)b.y=t.y+32; if(t.dir===3)b.x=t.x-6; bullets.push(b); }
function drawTank(t, color){ x.save(); x.translate(t.x+15,t.y+15); x.rotate(t.dir*Math.PI/2); x.fillStyle=color; x.fillRect(-15,-13,30,26); x.fillStyle='#111'; x.fillRect(-11,-16,7,32); x.fillRect(4,-16,7,32); x.fillStyle='#f4e9a8'; x.fillRect(-4,-4,8,8); x.fillRect(-2,-22,4,18); x.restore(); }
function draw(){ x.fillStyle='#202820'; x.fillRect(0,0,600,480); walls.forEach(w=>{x.fillStyle='#9c5a35';x.fillRect(...w);x.strokeStyle='#63351e';x.strokeRect(...w)}); x.fillStyle=base.alive?'#f4d35e':'#333'; x.fillRect(base.x,base.y,base.w,base.h); x.fillStyle='#111'; x.fillRect(base.x+8,base.y+8,14,14); drawTank(player,'#72d572'); enemies.forEach(e=>drawTank(e,'#d95c4a')); bullets.forEach(b=>{x.fillStyle=b.own?'#fff4a3':'#ffb1a8';x.fillRect(b.x,b.y,b.w,b.h)}); if(over){x.fillStyle='#000b';x.fillRect(0,0,600,480);x.fillStyle=won?'#9cff9c':'#ffb1a8';x.font='bold 34px system-ui';x.textAlign='center';x.fillText(won?'胜利！':'基地被毁，任务失败',300,235);} }
function update(){ if(over)return; tick++; player.cool=Math.max(0,player.cool-1); if(keys.has('ArrowUp')||keys.has('w')){player.dir=0;move(player,3)} if(keys.has('ArrowRight')||keys.has('d')){player.dir=1;move(player,3)} if(keys.has('ArrowDown')||keys.has('s')){player.dir=2;move(player,3)} if(keys.has('ArrowLeft')||keys.has('a')){player.dir=3;move(player,3)} if(keys.has(' '))fire(player,true);
 enemies.forEach(e=>{e.cool--; e.turn--; if(e.turn<=0){e.dir=Math.floor(Math.random()*4);e.turn=20+Math.random()*40} if(!move(e,1.3))e.turn=0; if(Math.random()<.018)fire(e,false)});
 bullets.forEach(b=>{if(b.dir===0)b.y-=6;if(b.dir===1)b.x+=6;if(b.dir===2)b.y+=6;if(b.dir===3)b.x-=6});
 bullets.forEach(b=>{ if(b.x<0||b.y<0||b.x>600||b.y>480)b.dead=true; walls.forEach((w,i)=>{if(hit(b,{x:w[0],y:w[1],w:w[2],h:w[3]})){b.dead=true; walls.splice(i,1)}}); if(base.alive&&hit(b,base)){base.alive=false;over=true;won=false} if(b.own){enemies.forEach(e=>{if(hit(b,e)){b.dead=e.dead=true;score++}})} else if(hit(b,player)){b.dead=true;lives--;Object.assign(player,{x:285,y:400,dir:0}); if(lives<=0){over=true;won=false}} });
 enemies=enemies.filter(e=>!e.dead); bullets=bullets.filter(b=>!b.dead); if(score>=12){over=true;won=true} if(tick%90===0)spawn(); scoreEl.textContent='SCORE '+score; livesEl.textContent='LIVES '+lives; statusEl.textContent=over?(won?'胜利完成':'按重新开始再来一局'):'WASD / 方向键移动，空格开火'; }
function loop(){ update(); draw(); if(!over)requestAnimationFrame(loop); else draw(); }
addEventListener('keydown',e=>{ if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault(); keys.add(e.key.length===1?e.key.toLowerCase():e.key); });
addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));
restart();
</script>
