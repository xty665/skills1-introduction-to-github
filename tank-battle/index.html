<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>钢铁前线</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101811;color:#eef5e8;font-family:monospace}main{text-align:center}h1{color:#ffd05b;letter-spacing:.2em}canvas{max-width:94vw;background:#304c32;border:5px solid #78906d;image-rendering:pixelated}.tip{color:#b7c5ae}button{font:inherit;background:#ffd05b;border:0;padding:10px 18px;font-weight:bold;cursor:pointer}
</style><main><h1>钢铁前线</h1><p id="hud">得分：0　生命：3　敌军：12</p><canvas id="c" width="600" height="480"></canvas><p class="tip">方向键 / WASD 移动　空格键开火</p><button id="go">开始战斗</button></main><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),hud=document.querySelector('#hud'),key={};let p,es,bs,score,lives,on,last;
addEventListener('keydown',e=>{key[e.key]=1;if(e.key===' ')fire(p);if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>key[e.key]=0);
function reset(){p={x:280,y:420,d:[0,-1],cool:0};es=[];bs=[];score=0;lives=3;on=true;last=performance.now();document.querySelector('#go').textContent='重新开始';requestAnimationFrame(loop)}
function fire(t){if(!on||!t||t.cool>0)return;t.cool=t===p?260:800;bs.push({x:t.x+15,y:t.y+15,dx:t.d[0],dy:t.d[1],own:t});}
function spawn(){if(es.length+score/100>=12)return;let x=[30,285,540][Math.random()*3|0];es.push({x,y:20,d:[0,1],cool:400,turn:0})}
function loop(n){if(!on)return;let dt=Math.min(.035,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){let v=160*dt,dx=(key.ArrowRight||key.d?1:0)-(key.ArrowLeft||key.a?1:0),dy=(key.ArrowDown||key.s?1:0)-(key.ArrowUp||key.w?1:0);if(dx||dy){p.x=Math.max(0,Math.min(570,p.x+dx*v));p.y=Math.max(0,Math.min(450,p.y+dy*v));p.d=dx?[dx,0]:[0,dy]}[p,...es].forEach(t=>t.cool-=dt*1000);if(Math.random()<dt*1.1)spawn();es.forEach(t=>{t.turn-=dt;if(t.turn<0){t.d=Math.random()<.65?[0,1]:[Math.random()<.5?-1:1,0];t.turn=.4+Math.random()*1.3}t.x=Math.max(0,Math.min(570,t.x+t.d[0]*55*dt));t.y=Math.max(0,Math.min(450,t.y+t.d[1]*55*dt));if(Math.random()<dt*.75)fire(t)});bs.forEach(b=>{b.x+=b.dx*330*dt;b.y+=b.dy*330*dt;if(b.x<0||b.y<0||b.x>600||b.y>480)b.dead=1;[p,...es].forEach(t=>{if(t!==b.own&&!t.dead&&Math.hypot(b.x-(t.x+15),b.y-(t.y+15))<18){b.dead=1;t.dead=1;if(t===p){lives--;if(lives<1)end(false);else Object.assign(p,{x:280,y:420,d:[0,-1]})}else score+=100}})});es=es.filter(t=>!t.dead);bs=bs.filter(b=>!b.dead);hud.textContent='得分：'+score+'　生命：'+lives+'　敌军：'+(12-score/100);if(score>=1200)end(true)}
function tank(t,col){g.save();g.translate(t.x+15,t.y+15);g.fillStyle=col;g.fillRect(-13,-13,26,26);g.fillStyle='#273527';g.fillRect(-10,-13,5,26);g.fillRect(5,-13,5,26);g.fillStyle='#efe3b5';g.fillRect(-4,-21,8,20);g.restore()}
function draw(){g.fillStyle='#304c32';g.fillRect(0,0,600,480);g.fillStyle='#4b7a44';for(let i=0;i<45;i++)g.fillRect((i*83)%600,(i*127)%480,9,9);g.fillStyle='#d9c27a';g.fillRect(276,454,48,20);g.fillStyle='#d84d3c';g.fillRect(298,438,5,17);tank(p,'#85c86b');es.forEach(t=>tank(t,'#df6657'));g.fillStyle='#fff28a';bs.forEach(b=>g.fillRect(b.x-3,b.y-3,6,6))}
function end(win){on=false;setTimeout(()=>alert(win?'胜利！敌军已全部击退。':'基地失守，点击重新开始。'),20)}document.querySelector('#go').onclick=reset;draw();
</script></html>
